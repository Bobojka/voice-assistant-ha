name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: JSON files parse
        run: |
          for f in manifest.json hacs.json strings.json translations/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
      - name: Tests
        run: script/test
