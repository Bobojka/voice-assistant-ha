name: Release

# A push to master that changes manifest.json with a version that has no
# release yet -> tests -> tag vX.Y.Z + GitHub Release (HACS picks it up).
# Manual run: releases the current manifest version if it has no release.
on:
  push:
    branches: [master]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Release the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if [ -z "$v" ]; then
            echo "::error::manifest.json has no version"
            exit 1
          fi
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released"
            exit 0
          fi
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$v" --generate-notes
